[project]
name = "workpal-agentscope"
version = "0.1.0"
description = "AgentScope execution service for WorkPal"
requires-python = ">=3.11"
dependencies = [
  "agentscope==2.0.9",
  "fastapi==0.142.2",
  "httpx==0.28.1",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workpal_agentscope"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
