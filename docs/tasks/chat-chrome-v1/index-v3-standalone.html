[data-theme=light]{--background:#fafaf8;--foreground:#111111;--card:#fff;--primary:#1a1a1a;--primary-foreground:#f1f1ef;--secondary:#f0f0ed;--accent:#4f6ef7;--chat-user:var(--accent);--chat-user-fg:#fff;--chat-bot:#efefeb;--muted:#f0f0ed;--muted-foreground:#52525b;--destructive:#dc2626;--border:#f0f0ed;--input:#eaeae6;--sidebar:#ecece9;--sidebar-border:#e8e8e4;--sidebar-accent:#fff;--link:#2563eb;--success:#228b3b;--warning:#b7791f;--ring:#6c6c70;--radius:.75rem}
:root{
 --chat-column:704px; --chat-gutter:24px; --composer-width:calc(var(--chat-column) + 2*var(--chat-gutter));
 --chat-font-size:15.5px; --chat-line-height:1.6; --user-bubble-max:90%;
 --card-w-narrow:360px; --card-w-medium:528px; --card-w-full:100%;
 --card-radius:14px; --card-pad-x:16px; --card-pad-y:14px;
 --bubble-r:18px; --bubble-join:2px;
 --hairline:rgba(26,26,20,.09); --hairline-soft:rgba(26,26,20,.06);
 --elev-1:0 1px 1px rgba(40,40,30,.03),0 2px 6px -2px rgba(40,40,30,.05);
 --elev-2:0 1px 2px rgba(40,40,30,.04),0 8px 24px -8px rgba(40,40,30,.10);
 --elev-hover:0 6px 20px -6px rgba(40,40,30,.22),0 2px 6px -2px rgba(40,40,30,.10),0 0 0 1px rgba(26,26,20,.14);
 --elev-modal:0 8px 40px -12px rgba(40,40,30,.28),0 0 0 1px var(--hairline);
 --fg-2:#374151; --fg-3:var(--muted-foreground); --fg-4:#6b7280; --surface-sunk:#f5f5f2;
 --font-sans:"Geist Variable","Noto Sans CJK SC","PingFang SC",system-ui,sans-serif;
 --font-mono:ui-monospace,"SF Mono","JetBrains Mono","Noto Sans Mono CJK SC",monospace;
}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--background);color:var(--foreground);font:400 14px/1.5 var(--font-sans);-webkit-font-smoothing:antialiased;text-autospace:normal;line-break:strict}
svg.i{width:16px;height:16px;flex:none;fill:currentColor;display:block}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:flex;height:100vh}
/* 侧栏 */
.side{width:280px;flex:none;background:var(--sidebar);border-right:1px solid var(--sidebar-border);display:flex;flex-direction:column;padding:12px 8px}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 12px;color:var(--fg-3)}
.side-top b{font-weight:600;color:var(--foreground);font-size:14px;letter-spacing:-.01em}
.side-top .acts{display:flex;gap:4px}.ib{width:28px;height:28px;border:0;background:none;border-radius:8px;display:grid;place-items:center;color:var(--fg-3)}.ib:hover{background:rgba(0,0,0,.05);color:var(--foreground)}
.search{display:flex;gap:8px;align-items:center;height:32px;padding:0 10px;border-radius:9px;background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 1px var(--hairline-soft);color:var(--fg-4);font-size:13px;margin:0 4px 12px}
.th{display:flex;gap:10px;padding:8px;border-radius:10px;align-items:flex-start}
.th.on{background:var(--sidebar-accent);box-shadow:var(--elev-1)}
.th img{width:28px;height:28px}.th .n{display:flex;justify-content:space-between;font-size:13.5px;font-weight:500}.th .n time{font-size:11.5px;color:var(--fg-4);font-weight:400;font-variant-numeric:tabular-nums}
.th .p{font-size:12.5px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
@media (max-width:1023px){.side{display:none}}
/* 主区 */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.top{height:52px;flex:none;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;font-weight:500;border-bottom:1px solid transparent}
.top .meta{color:var(--fg-4);font-weight:400;font-size:12.5px}
.scroll{flex:1;overflow:auto;scrollbar-gutter:stable both-edges}
.col{width:100%;max-width:calc(var(--chat-column) + 2*var(--chat-gutter));margin:0 auto;padding:0 var(--chat-gutter) 32px}
@media (max-width:600px){:root{--chat-gutter:16px}.scroll{scrollbar-gutter:auto}.chip.web span.l{display:none}.tbl td{white-space:nowrap}}
/* —— 消息结构：气泡与卡片分离 —— */
.turn{padding:18px 0}.turn+.turn{padding-top:6px}
.bot .hd{display:flex;align-items:center;gap:8px;margin-bottom:10px;height:24px}
.bot .hd img{width:24px;height:24px}.bot .hd b{font-weight:600;font-size:13.5px}.bot .hd time{font-size:12px;color:var(--fg-4);font-variant-numeric:tabular-nums}
/* 气泡组 */
.bubbles{display:flex;flex-direction:column;gap:3px;align-items:flex-start;max-width:100%}
.b{font-size:var(--chat-font-size);line-height:var(--chat-line-height);padding:10px 14px;max-width:100%;overflow-wrap:anywhere}
.b p{margin:0 0 10px}.b>:last-child{margin-bottom:0}
.b strong{font-weight:600}
.b code.inl{font-family:var(--font-mono);font-size:.86em;background:rgba(0,0,0,.05);border-radius:5px;padding:1px 5px}
.bot .b{background:var(--chat-bot);color:var(--foreground);width:fit-content;max-width:100%}
/* 助手连续圆角：接合在左侧（靠近头像） */
.bot .b.solo{border-radius:var(--bubble-r)}
.bot .b.first{border-radius:var(--bubble-r) var(--bubble-r) var(--bubble-r) var(--bubble-join)}
.bot .b.middle{border-radius:var(--bubble-join) var(--bubble-r) var(--bubble-r) var(--bubble-join)}
.bot .b.last{border-radius:var(--bubble-join) var(--bubble-r) var(--bubble-r) var(--bubble-r)}
/* 用户气泡组：右对齐，接合在右侧 */
.user-group{display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.user .b,.user-group .b{background:var(--chat-user);color:var(--chat-user-fg);max-width:var(--user-bubble-max)}
.user-group .b.solo,.user .b.solo{border-radius:var(--bubble-r)}
.user-group .b.first{border-radius:var(--bubble-r) var(--bubble-r) var(--bubble-join) var(--bubble-r)}
.user-group .b.middle{border-radius:var(--bubble-r) var(--bubble-join) var(--bubble-join) var(--bubble-r)}
.user-group .b.last{border-radius:var(--bubble-r) var(--bubble-join) var(--bubble-r) var(--bubble-r)}
/* 气泡内文档 chip（超链接，非整张卡） */
.dchip{display:inline-flex;align-items:center;gap:5px;vertical-align:-3px;color:var(--foreground);text-decoration:none;border-bottom:1px solid rgba(26,26,20,.35);padding-bottom:1px;cursor:pointer;font-weight:500;font-size:inherit;line-height:1.2;background:none;border-top:0;border-left:0;border-right:0;border-radius:0;padding-left:0;padding-right:0}
.dchip:hover{border-bottom-color:var(--foreground)}
.dchip .dico{width:16px;height:16px;flex:none;display:block}
/* 气泡外：外置卡片区 */
.out{margin-top:10px;display:flex;flex-direction:column;gap:10px;align-items:stretch;width:100%}
.msg-acts{display:none} /* v3-full: replaced by hover-bar */
/* 卡片 */
.card{background:var(--card);border-radius:var(--card-radius);box-shadow:0 0 0 1px var(--hairline),var(--elev-1);max-width:100%;min-width:0;font-size:14px;line-height:1.55;overflow:hidden;text-align:left;border:0;display:block;width:100%;padding:0;font:inherit;color:inherit}
button.card,.card.openable{cursor:pointer;transition:box-shadow .18s ease,transform .18s ease}
button.card:hover,.card.openable:hover{box-shadow:var(--elev-hover);transform:translateY(-1px)}
button.card:active,.card.openable:active{transform:translateY(0);box-shadow:0 0 0 1px rgba(26,26,20,.14),var(--elev-1)}
.card.narrow{width:var(--card-w-narrow);max-width:100%}.card.medium{width:var(--card-w-medium);max-width:100%}.card.full{width:var(--card-w-full)}
.ch{display:flex;align-items:center;gap:8px;padding:12px var(--card-pad-x) 0;min-height:40px}
.ch .i{color:var(--fg-3)}.ch .t{font-weight:600;font-size:13.5px;flex:1;min-width:0}
.cb{padding:8px var(--card-pad-x) var(--card-pad-y)}
.cf{display:flex;align-items:center;gap:8px;padding:10px var(--card-pad-x);border-top:1px solid var(--hairline-soft)}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.run{color:#1f5fbf;background:#eef3fc}.pill.ok{color:var(--success);background:#edf6ef}.pill.wait{color:#9a6312;background:#fbf3e4}.pill.neutral{color:var(--fg-3);background:var(--muted)}.pill.stale{color:var(--fg-3);background:var(--muted)}
.btn{height:32px;padding:0 14px;border-radius:9px;border:0;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:background .15s}
.btn.p{background:var(--primary);color:var(--primary-foreground)}.btn.p:hover{background:#333}
.btn.s{background:var(--card);box-shadow:inset 0 0 0 1px var(--hairline)}.btn.s:hover{background:var(--surface-sunk)}
.btn.g{background:none;color:var(--fg-3);padding:0 8px}.btn.g:hover{color:var(--foreground)}
.btn:focus-visible,.ib:focus-visible,.opt:focus-visible,.dchip:focus-visible,button.card:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
/* 页面类型卡 */
.page-row{display:flex;gap:12px;align-items:flex-start;padding:14px var(--card-pad-x)}
.page-ico{width:36px;height:36px;flex:none;border-radius:8px;background:var(--surface-sunk);box-shadow:inset 0 0 0 1px var(--hairline-soft);display:grid;place-items:center}
.page-t{font-size:14.5px;font-weight:600;line-height:1.35;letter-spacing:-.01em}
.page-st{font-size:12.5px;color:var(--fg-3);margin-top:3px}
.page-st.upd{color:var(--fg-3);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.page-st.upd:hover{color:var(--foreground)}
.page-sum{font-size:13.5px;line-height:1.6;color:var(--fg-2);margin:0;padding:0 var(--card-pad-x) 12px}
.page-toc{border-top:1px solid var(--hairline-soft);padding:10px var(--card-pad-x) 14px}
.page-toc .lab{font-size:11.5px;color:var(--fg-4);margin-bottom:6px;font-weight:500}
.page-toc a{display:block;font-size:13px;color:var(--fg-2);text-decoration:none;padding:3px 0}.page-toc a:hover{color:var(--link)}
.page.stale .page-t{color:var(--fg-3)}.page.stale{opacity:.92}
/* 代码 */
.code .ch{padding-bottom:0}.code .lang{font-size:12px;color:var(--fg-3);font-family:var(--font-mono)}
.code pre{margin:0;padding:10px var(--card-pad-x) 14px;overflow-x:auto;font:13px/1.7 var(--font-mono);color:#2a2a2e}
.tok-k{color:#8a3ab9}.tok-s{color:#2f7d3a}.tok-c{color:var(--fg-4)}.tok-n{color:#b0571a}.tok-f{color:#1f5fbf}
/* 表格 */
.tbl .scroll-x{overflow-x:auto;border-top:1px solid var(--hairline-soft)}
.tbl table{border-collapse:collapse;width:max-content;min-width:100%;font-size:13px;line-height:1.5}
.tbl th{font-size:12px;font-weight:500;color:var(--fg-3);text-align:left;padding:8px 12px;background:var(--surface-sunk);border-bottom:1px solid var(--hairline-soft);vertical-align:bottom}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--hairline-soft);vertical-align:top}
.tbl th,.tbl td{min-width:5.5em;max-width:16em;overflow-wrap:anywhere}
.tbl th:first-child,.tbl td:first-child{white-space:nowrap;padding-left:var(--card-pad-x);min-width:4em}
.tbl tr:last-child td{border-bottom:0}.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.up{color:var(--success)}.tbl td.down{color:var(--destructive)}
.tbl .cf{font-size:12px;color:var(--fg-3)}
/* 计划 */
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:13.5px}
.steps li .i{margin-top:2px}.steps li .d{flex:1;min-width:0}.steps li .m{font-size:12px;color:var(--fg-4);font-variant-numeric:tabular-nums}
.steps li.done .i{color:var(--success)}.steps li.done .d{color:var(--fg-3)}
.steps li.now .i{color:#1f5fbf;animation:spin 1s linear infinite}.steps li.now .d{font-weight:500}
.steps li.todo .i{color:#c8c8c4}.steps li.todo .d{color:var(--fg-3)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.steps li.now .i{animation:none}}
.progress{height:3px;border-radius:2px;background:var(--muted);margin:4px 0 6px;overflow:hidden}.progress i{display:block;height:100%;width:45%;background:#1f5fbf;border-radius:2px}
/* 键值 */
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px;margin:4px 0 2px}.kv dt{color:var(--fg-3)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
/* 选择 */
.opts{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.opt{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:9px;border:0;background:none;text-align:left;font-size:14px;box-shadow:inset 0 0 0 1px var(--hairline-soft)}
.opt:hover{background:var(--surface-sunk)}
.opt kbd{font:500 11px/1 var(--font-mono);color:var(--fg-3);width:20px;height:20px;border-radius:5px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--hairline),0 1px 0 var(--hairline)}
.opt .x{flex:1}.opt .s{font-size:12px;color:var(--fg-4)}
.opt.sel{box-shadow:inset 0 0 0 1.5px var(--foreground)}.opt.sel kbd{background:var(--foreground);color:#fff;box-shadow:none}
/* 文件 */
.file{display:flex;gap:12px;align-items:center;padding:12px 12px 12px var(--card-pad-x)}
.doc{width:32px;height:40px;flex:none;border-radius:4px 10px 4px 4px;background:linear-gradient(#fff,#fff) padding-box;box-shadow:inset 0 0 0 1px var(--hairline);display:grid;place-items:end center;padding-bottom:5px;font:600 8.5px/1 var(--font-mono);color:var(--fg-3);letter-spacing:.04em;position:relative}
.doc::before{content:"";position:absolute;right:0;top:0;width:9px;height:9px;border-radius:0 9px 0 3px;background:var(--surface-sunk);box-shadow:inset 1px -1px 0 var(--hairline)}
.file .nm{font-size:13.5px;font-weight:500;line-height:1.4;overflow-wrap:anywhere}.file .mt{font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.file .acts{display:flex;gap:2px;margin-left:auto}
/* 图表 */
.chart{display:grid;grid-template-columns:36px 1fr;padding:12px var(--card-pad-x) 4px}
.yax{display:flex;flex-direction:column;justify-content:space-between;height:180px;font-size:11px;color:var(--fg-4);font-variant-numeric:tabular-nums;text-align:right;padding-right:8px;transform:translateY(-6px)}
.plot{position:relative;height:180px;display:flex;align-items:flex-end;gap:12%;padding:0 6%;background:repeating-linear-gradient(to top,var(--hairline-soft) 0 1px,transparent 1px 45px);border-bottom:1px solid var(--hairline)}
.bar{flex:1;max-width:72px;border-radius:5px 5px 0 0;background:var(--foreground);position:relative}

.xax{grid-column:2;display:flex;gap:12%;padding:8px 6% 0;font-size:12px;color:var(--fg-3)}.xax div{flex:1;max-width:72px;text-align:center}
.src{font-size:12px;color:var(--fg-4);padding:8px var(--card-pad-x) 14px}

.rows{border-top:1px solid var(--hairline-soft)}
.rowi{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--hairline-soft);font-size:13.5px}.rowi:last-child{border-bottom:0}
.rowi .i{color:var(--fg-3)}.rowi .x{flex:1}.rowi .m{font-size:12px;color:var(--fg-4);font-variant-numeric:tabular-nums}
/* 输入框 */
.composer{flex:none;padding:8px 0 20px;background:linear-gradient(transparent,var(--background) 24px)}
.composer .wrap{max-width:var(--composer-width);margin:0 auto;padding:0 16px}

.cbox{background:var(--card);border-radius:20px;box-shadow:0 0 0 1px var(--hairline),var(--elev-2);padding:12px 12px 8px 16px}
.cbox .ph{font-size:15px;color:var(--fg-4);padding:2px 0 14px;min-height:24px}
.tools{display:flex;align-items:center;gap:4px}
.chip{white-space:nowrap;height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border-radius:8px;border:0;background:none;font-size:12.5px;color:var(--fg-3)}.chip:hover{background:var(--surface-sunk)}
.send{width:32px;height:32px;border-radius:50%;border:0;background:var(--primary);color:#fff;display:grid;place-items:center;margin-left:4px}
.hint{text-align:center;font-size:11.5px;color:var(--fg-4);margin-top:8px}

@media (max-width:600px){.toggle{display:none}.top{justify-content:flex-start;padding-left:56px}}

/* —— 消息悬停快捷条 —— */

.msg-wrap{position:relative;display:inline-flex;align-items:flex-start;gap:6px;max-width:100%;vertical-align:top}

.hover-bar{display:none;align-items:center;gap:0;flex:none;padding:2px;border-radius:10px;background:var(--card);box-shadow:0 0 0 1px var(--hairline),var(--elev-2);position:absolute;z-index:4;white-space:nowrap}

.turn.user .hover-bar{right:calc(100% + 6px);top:2px}

/* 可点卡标记 */
.card.openable .page-st.upd{pointer-events:auto}

.modal-hd{flex:none;display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--hairline-soft)}

.modal-bd-close{position:absolute;inset:0}
.modal-x{width:32px;height:32px;border:0;border-radius:8px;background:none;display:grid;place-items:center;color:var(--fg-3)}.modal-x:hover{background:var(--surface-sunk);color:var(--foreground)}

.modal-body code{font-family:var(--font-mono);font-size:.88em;background:var(--surface-sunk);border-radius:4px;padding:1px 5px}

document.querySelectorAll('[data-i]').forEach(e=>e.insertAdjacentHTML('afterbegin',I(e.dataset.i)));

/* 弹窗 */
const modal=document.getElementById('modal');
const modalTitle=document.getElementById('modal-title');
const modalBody=document.getElementById('modal-body');
const modalIco=document.getElementById('modal-ico');
function openPage(id){
  const p=PAGES[id]; if(!p) return;
  modalTitle.textContent=p.title;
  modalIco.innerHTML=PAGE_ICO_LG;
  modalBody.innerHTML=p.body||'';
  modal.hidden=false; modal.classList.add('open');
  document.body.classList.add('modal-open');
  modal.querySelector('[data-close].modal-x')?.focus();
}
function closeModal(){
  modal.classList.remove('open'); modal.hidden=true;
  document.body.classList.remove('modal-open');
}
document.addEventListener('click',e=>{
  if(e.target.closest('.acts, .btn, .ib, .hover-bar')){
    // 卡内小按钮 / 快捷条：不触发整卡打开
    if(!e.target.closest('[data-open].dchip') && !e.target.closest('.page-st.upd') && !e.target.closest('[data-open].card') && !e.target.closest('[data-open].openable')){
      /* only block when clicking acts inside openable */
    }
  }
  const actInside=e.target.closest('.card.openable .acts, .card.openable .btn, .card.openable .ib, .hover-bar .hb');
  if(actInside && !e.target.closest('[data-open].dchip') && !e.target.closest('[data-open].page-st')){ return; }
  const open=e.target.closest('[data-open]');
  if(open){ e.preventDefault(); openPage(open.dataset.open); return; } /* 旧卡/chip/文案 → 一律打开最新 */
  if(e.target.closest('[data-close]')){ closeModal(); }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&modal.classList.contains('open')) closeModal();
  if((e.key==='Enter'||e.key===' ')&&e.target.closest?.('[data-open].openable')){ e.preventDefault(); openPage(e.target.closest('[data-open]').dataset.open); }
});

/* 可选：?open=trio-v2 直接打开，方便截图 */
const qs=new URLSearchParams(location.search);
if(qs.get('open')) openPage(qs.get('open'));
if(qs.get('hover')) document.querySelectorAll('.msg-wrap').forEach((el,i)=>{ if(i===0 || el.closest('.user')) el.classList.add('show-hover'); });
/* force first bot + first user for demo */
if(qs.get('hover')==='demo'){
  const bots=[...document.querySelectorAll('.turn.bot .msg-wrap')];
  const users=[...document.querySelectorAll('.turn.user .msg-wrap')];
  bots.slice(-2,-1).forEach(el=>el.classList.add('show-hover')); /* trio bot */
  if(users[0]) users[0].classList.add('show-hover');
  if(users[users.length-1]) users[users.length-1].classList.add('show-hover');
}
