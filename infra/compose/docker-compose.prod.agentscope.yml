# Legacy AgentScope overlay, reduced to the IP-direct HTTP delta.
#
# The base docker-compose.prod.yml now natively carries the Java AgentScope
# runtime: the `agentscope` service builds services/agent-runtime/Dockerfile,
# and api/worker already set AGENT_RUNTIME=agentscope, AGENTSCOPE_URL and the
# tool-bridge environment. This overlay previously redefined `agentscope` with
# the removed Python runtime (services/agentscope/Dockerfile), which overrode
# the base Java service and broke `deploy-workpal.sh` at build time; that
# definition was dropped in the WK-01 topology audit (2026-10-16).
#
# What remains is the only delta over the base file: the plain-HTTP 8080
# publication used by the IP-direct Caddyfile (infra/compose/Caddyfile.ip-http
# listens on :8080). Layer order is unchanged:
#
#   docker compose --env-file .env \
#     -f infra/compose/docker-compose.prod.yml \
#     -f infra/compose/docker-compose.prod.docker.yml \
#     -f infra/compose/docker-compose.prod.agentscope.yml \
#     up -d --build

services:
  caddy:
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "8080:8080"
